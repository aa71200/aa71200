name: WordPress fixture
on:
  workflow_call:
    inputs:
      woocommerce:
        type: boolean
        default: true
      activate:
        type: boolean
        default: false
      access_migration:
        type: boolean
        default: false
      wordpress_version:
        type: string
        default: '7.1.3'
      woocommerce_version:
        type: string
        default: '11.1.2'
      php_version:
        type: string
        default: '8.2'
      browser:
        type: boolean
        default: false
      harness_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.activate && '["baseline","minimum","php83"]' || '["baseline"]') }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture
          MARIADB_DATABASE: portfolio_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aa71200/aa71200
          ref: ${{ inputs.harness_ref }}
          path: .portfolio-qa
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.environment == 'php83' && '8.3' || inputs.php_version }}
          extensions: mysqli, mbstring, curl, zip
          coverage: none
      - name: Lint project PHP
        run: git ls-files -z '*.php' ':!src/Vendor/**' | xargs -0 -r -n1 php -l
      - name: Check WordPress coding standards
        if: matrix.environment == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --working-dir=.portfolio-qa/.github/portfolio/quality
          quality=.portfolio-qa/.github/portfolio/quality
          report="$RUNNER_TEMP/wordpress-coding-standards.json"
          files="$RUNNER_TEMP/wordpress-php-files.txt"
          git -c core.quotePath=false ls-files '*.php' \
            ':!src/Vendor/**' ':!**/vendor/**' ':!**/node_modules/**' > "$files"
          phpcs_status=0
          "$quality/vendor/bin/phpcs" \
            --standard=WordPress --file-list="$files" --report=json > "$report" || phpcs_status=$?
          if [[ "$phpcs_status" -gt 3 ]]; then
            cat "$report"
            exit "$phpcs_status"
          fi
          php "$quality/check-wpcs.php" check "$GITHUB_WORKSPACE" "$report"
      - name: Install disposable WordPress
        shell: bash
        env:
          INSTALL_WC: ${{ inputs.woocommerce }}
          LOAD_CALLER_PLUGIN: ${{ inputs.activate }}
          WP_VERSION: ${{ matrix.environment == 'minimum' && '7.0' || inputs.wordpress_version }}
          WC_VERSION: ${{ matrix.environment == 'minimum' && '11.1.0' || inputs.woocommerce_version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/wp"
          [[ "$WP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ && "$WC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --fail --silent --show-error --retry 3 "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" |
            tar -xz --strip-components=1 -C "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          cat > wp-config.php <<'PHP'
          <?php
          define( 'DB_NAME', 'portfolio_fixture' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'fixture' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          define( 'WP_HOME', 'http://127.0.0.1:8077' );
          define( 'WP_SITEURL', WP_HOME );
          define( 'DISABLE_WP_CRON', true );
          define( 'WP_HTTP_BLOCK_EXTERNAL', true );
          $table_prefix = 'portfolio_';
          require_once __DIR__ . '/wp-settings.php';
          PHP
          mkdir -p wp-content/mu-plugins
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_true" );' > wp-content/mu-plugins/offline.php
          plugins=()
          if [[ "$INSTALL_WC" == "true" ]]; then
            curl --fail --silent --show-error --retry 3 "https://downloads.wordpress.org/plugin/woocommerce.$WC_VERSION.zip" -o "$RUNNER_TEMP/woocommerce.zip"
            unzip -q "$RUNNER_TEMP/woocommerce.zip" -d wp-content/plugins
            plugins+=(woocommerce)
          fi
          if [[ "$LOAD_CALLER_PLUGIN" == "true" ]]; then
            slug="${GITHUB_REPOSITORY#*/}"
            package="$(php "$GITHUB_WORKSPACE/.portfolio-qa/.github/portfolio/package.php" "$GITHUB_WORKSPACE" "$slug" "$RUNNER_TEMP/packages")"
            ( cd "$RUNNER_TEMP/packages" && sha256sum -c "$(basename "$package").sha256" )
            unzip -q "$package" -d wp-content/plugins
            plugins+=("$slug")
          fi
          cat > provision-portfolio.php <<'PHP'
          <?php
          declare(strict_types=1);
          define( 'WP_INSTALLING', true );
          require __DIR__ . '/wp-load.php';
          require_once ABSPATH . 'wp-admin/includes/upgrade.php';
          require_once ABSPATH . 'wp-admin/includes/plugin.php';
          if ( ! is_blog_installed() ) {
            wp_install( 'Portfolio Fixture', 'fixture-admin', 'admin@example.test', true, '', wp_generate_password( 32 ) );
          }
          wp_installing( false );
          update_option( 'woocommerce_coming_soon', 'no' );
          foreach ( $argv as $index => $slug ) {
            if ( 0 === $index ) { continue; }
            $entry = "$slug/$slug.php";
            $result = activate_plugin( $entry );
            if ( is_wp_error( $result ) ) { throw new RuntimeException( $result->get_error_message() ); }
            require_once WP_PLUGIN_DIR . '/' . $entry;
            if ( 'woocommerce' === $slug ) {
              WC()->init();
              $service = wc_get_container()->get( \Automattic\WooCommerce\Internal\DataStores\Orders\DataSynchronizer::class );
              if ( ! $service->create_database_tables() ) {
                throw new RuntimeException( 'Could not initialise HPOS tables.' );
              }
              update_option( 'woocommerce_custom_orders_table_enabled', 'yes' );
              update_option( 'woocommerce_custom_orders_table_data_sync_enabled', 'no' );
            }
          }
          PHP
          php provision-portfolio.php "${plugins[@]}"
      - name: Exercise WordPress fixture
        shell: bash
        env:
          CHECK_ACCESS_MIGRATION: ${{ inputs.access_migration }}
        run: |
          set -euo pipefail
          export CODEXAWP_TEST_WP_LOAD="$RUNNER_TEMP/wp/wp-load.php"
          if [[ "$CHECK_ACCESS_MIGRATION" == "true" ]]; then
            php examples/elementor-access-controls/tests/check.php
            php examples/purchase-access/tests/check.php
            php examples/purchase-access/tests/check.php --legacy-orders
            export ACP_TEST_WP_ROOT="$RUNNER_TEMP/wp"
            export ACP_TEST_DB_HOST='127.0.0.1:3306'
            export ACP_TEST_DB_USER='root'
            export ACP_TEST_DB_PASSWORD='fixture'
            php examples/template-storage-upgrade/tests/acceptance/check.php | tee "$RUNNER_TEMP/migration.log"
            grep -Eq '^[1-9][0-9]* migration checks passed\.' "$RUNNER_TEMP/migration.log"
          elif [[ -f tests/check.php ]]; then
            php tests/check.php
            if [[ "${GITHUB_REPOSITORY#*/}" == "packchin-cart-integrity" ]]; then
              php tests/check.php --customer
            fi
          elif [[ -f tests/quote-test.php ]]; then
            php tests/quote-test.php
          elif [[ -f tests/catalog.php ]]; then
            php tests/catalog.php
          else
            echo "Missing the repository test entry point." >&2
            exit 1
          fi
      - name: Verify shipping demo upgrade from the published ZIP
        if: inputs.browser && matrix.environment == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          slug="${GITHUB_REPOSITORY#*/}"
          case "$slug" in
            woo-carton-shipping-demo|woo-pickup-point-checkout) ;;
            *) exit 0 ;;
          esac
          fixture="$GITHUB_WORKSPACE/.portfolio-qa/.github/portfolio"
          export CODEXAWP_TEST_WP_LOAD="$RUNNER_TEMP/wp/wp-load.php"
          previous="$RUNNER_TEMP/$slug-previous.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/aa71200/$slug/releases/download/v1.0.0/$slug-1.0.0.zip" -o "$previous"
          unzip -oq "$previous" -d "$RUNNER_TEMP/wp/wp-content/plugins"
          php "$fixture/shipping-upgrade.php" "$slug" before 1.0.0
          package="$(find "$RUNNER_TEMP/packages" -maxdepth 1 -name "$slug-*.zip" -print -quit)"
          unzip -oq "$package" -d "$RUNNER_TEMP/wp/wp-content/plugins"
          version="${package%.zip}"
          version="${version##*-}"
          php "$fixture/shipping-upgrade.php" "$slug" after "$version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.browser || inputs.access_migration
        with:
          node-version: '22'
      - name: Exercise access card style inheritance
        if: inputs.access_migration
        run: node --test examples/access-status-builder/tests/computed-styles.test.mjs
      - name: Exercise Classic and Blocks checkout
        if: inputs.browser
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.portfolio-qa/.github/portfolio"
          npm ci --prefix "$fixture/browser" --ignore-scripts
          ( cd "$fixture/browser" && npx playwright install --with-deps chromium )
          export CODEXAWP_TEST_WP_LOAD="$RUNNER_TEMP/wp/wp-load.php"
          export CODEXAWP_TEST_PLUGIN="${GITHUB_REPOSITORY#*/}"
          bash "$fixture/serve-checkout-ci.sh" "$RUNNER_TEMP/wp" "$RUNNER_TEMP/checkout-server" "$fixture/browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.activate && matrix.environment == 'baseline'
        with:
          name: installable-demo
          path: ${{ runner.temp }}/packages/*
