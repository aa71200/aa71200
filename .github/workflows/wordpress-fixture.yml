name: WordPress fixture
on:
  workflow_call:
    inputs:
      woocommerce:
        type: boolean
        default: true
      activate:
        type: boolean
        default: false
      access_migration:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture
          MARIADB_DATABASE: portfolio_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, zip
          coverage: none
      - name: Install disposable WordPress
        shell: bash
        env:
          INSTALL_WC: ${{ inputs.woocommerce }}
          LOAD_CALLER_PLUGIN: ${{ inputs.activate }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/wp"
          curl --fail --silent --show-error --retry 3 https://wordpress.org/wordpress-7.1.3.tar.gz |
            tar -xz --strip-components=1 -C "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          cat > wp-config.php <<'PHP'
          <?php
          define( 'DB_NAME', 'portfolio_fixture' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'fixture' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          define( 'WP_HOME', 'http://portfolio.test' );
          define( 'WP_SITEURL', WP_HOME );
          define( 'DISABLE_WP_CRON', true );
          define( 'WP_HTTP_BLOCK_EXTERNAL', true );
          $table_prefix = 'portfolio_';
          require_once __DIR__ . '/wp-settings.php';
          PHP
          mkdir -p wp-content/mu-plugins
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_true" );' > wp-content/mu-plugins/offline.php
          plugins=()
          if [[ "$INSTALL_WC" == "true" ]]; then
            curl --fail --silent --show-error --retry 3 https://downloads.wordpress.org/plugin/woocommerce.11.1.2.zip -o "$RUNNER_TEMP/woocommerce.zip"
            unzip -q "$RUNNER_TEMP/woocommerce.zip" -d wp-content/plugins
            plugins+=(woocommerce)
          fi
          if [[ "$LOAD_CALLER_PLUGIN" == "true" ]]; then
            slug="${GITHUB_REPOSITORY#*/}"
            test -f "$GITHUB_WORKSPACE/$slug.php"
            ln -s "$GITHUB_WORKSPACE" "wp-content/plugins/$slug"
            plugins+=("$slug")
          fi
          cat > provision-portfolio.php <<'PHP'
          <?php
          declare(strict_types=1);
          define( 'WP_INSTALLING', true );
          require __DIR__ . '/wp-load.php';
          require_once ABSPATH . 'wp-admin/includes/upgrade.php';
          require_once ABSPATH . 'wp-admin/includes/plugin.php';
          if ( ! is_blog_installed() ) {
            wp_install( 'Portfolio Fixture', 'fixture-admin', 'admin@example.test', true, '', wp_generate_password( 32 ) );
          }
          wp_installing( false );
          update_option( 'woocommerce_coming_soon', 'no' );
          foreach ( $argv as $index => $slug ) {
            if ( 0 === $index ) { continue; }
            $entry = "$slug/$slug.php";
            $result = activate_plugin( $entry );
            if ( is_wp_error( $result ) ) { throw new RuntimeException( $result->get_error_message() ); }
            require_once WP_PLUGIN_DIR . '/' . $entry;
            if ( 'woocommerce' === $slug ) {
              WC()->init();
              $service = wc_get_container()->get( \Automattic\WooCommerce\Internal\DataStores\Orders\DataSynchronizer::class );
              if ( ! $service->create_database_tables() ) {
                throw new RuntimeException( 'Could not initialise HPOS tables.' );
              }
              update_option( 'woocommerce_custom_orders_table_enabled', 'yes' );
              update_option( 'woocommerce_custom_orders_table_data_sync_enabled', 'no' );
            }
          }
          PHP
          php provision-portfolio.php "${plugins[@]}"
      - name: Exercise WordPress fixture
        shell: bash
        env:
          CHECK_ACCESS_MIGRATION: ${{ inputs.access_migration }}
        run: |
          set -euo pipefail
          export CODEXAWP_TEST_WP_LOAD="$RUNNER_TEMP/wp/wp-load.php"
          if [[ "$CHECK_ACCESS_MIGRATION" == "true" ]]; then
            php examples/purchase-access/tests/check.php
            export ACP_TEST_WP_ROOT="$RUNNER_TEMP/wp"
            export ACP_TEST_DB_HOST='127.0.0.1:3306'
            export ACP_TEST_DB_USER='root'
            export ACP_TEST_DB_PASSWORD='fixture'
            php examples/template-storage-upgrade/tests/acceptance/check.php | tee "$RUNNER_TEMP/migration.log"
            grep -Eq '^[1-9][0-9]* migration checks passed\.' "$RUNNER_TEMP/migration.log"
          else
            php tests/check.php
          fi
